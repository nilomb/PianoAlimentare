<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Piano Alimentare</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

img {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
}
</style>
</head>

<body>

<img id="img">

<script>

const giorni = [
    "domenica.png",
    "lunedi.png",
    "martedi.png",
    "mercoledi.png",
    "giovedi.png",
    "venerdi.png",
    "sabato.png"
];

let indice = new Date().getDay();

const img = document.getElementById("img");

function mostra() {
    img.src = giorni[indice];
}

mostra();

let startX = 0;

document.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {

    let endX = e.changedTouches[0].clientX;
    let diff = startX - endX;

    if (Math.abs(diff) < 50) return;

    // solo avanti
    if (diff > 0) {
        indice = (indice + 1) % 7;
        mostra();
    }
});

</script>

</body>
</html>
